<H4>User - Issues Statistics</H4>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">From year</label>
    <input class="form-control narrow-number-input" type="number" [(ngModel)]="fromYear" />
  </div>
  <div>
    <label class="form-label">To year</label>
    <input class="form-control narrow-number-input" type="number" [(ngModel)]="toYear" />
  </div>
  <div>
    <label class="form-label">Username pattern</label>
    <input class="form-control" type="text" [(ngModel)]="usernamePattern" placeholder="regex, optional" />
  </div>
  <button class="btn btn-primary" type="button" (click)="search()">Search</button>
</div>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">Summary pattern</label>
    <input class="form-control" type="text" [(ngModel)]="summaryPattern" placeholder="regex, optional" />
  </div>
  <div>
    <label class="form-label">Description pattern</label>
    <input class="form-control" type="text" [(ngModel)]="descriptionPattern" placeholder="regex, optional" />
  </div>
  <div>
    <label class="form-label">Comment pattern</label>
    <input class="form-control" type="text" [(ngModel)]="commentPattern" placeholder="regex, optional" />
  </div>
  <div>
    <label class="form-label">Comment author pattern</label>
    <input class="form-control" type="text" [(ngModel)]="commentAuthorPattern" placeholder="regex, optional" />
  </div>
</div>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">Min created issues</label>
    <input class="form-control" type="number" [(ngModel)]="minCreatedIssues" (ngModelChange)="onFilterInputsChanged()" />
  </div>
  <div>
    <label class="form-label">Max created issues</label>
    <input class="form-control" type="number" [(ngModel)]="maxCreatedIssues" (ngModelChange)="onFilterInputsChanged()" />
  </div>
  <div>
    <label class="form-label">Name contains</label>
    <input class="form-control" type="text" [(ngModel)]="nameContains" (ngModelChange)="onFilterInputsChanged()" placeholder="comma separated, e.g. john,mary" />
  </div>
  <div>
    <label class="form-label">Name pattern</label>
    <input class="form-control" type="text" [(ngModel)]="namePattern" (ngModelChange)="onFilterInputsChanged()" placeholder="comma separated regex, e.g. ^jo.*,mary$" />
  </div>
</div>

<ag-grid-angular
  style="width: 100%; height: 500px;"
  [rowData]="rowData()"
  [columnDefs]="colDefs()"
  [isExternalFilterPresent]="isExternalFilterPresent"
  [doesExternalFilterPass]="doesExternalFilterPass"
  (gridReady)="onGridReady($event)" />

@if (selectedIssueKey(); as key) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="openDetailAsRoute()">Show as page</button>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <app-issue-details [issueKey]="key" />
  </div>
}
