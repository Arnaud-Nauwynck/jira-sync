<H4>GitHub Pull Requests</H4>

<app-github-pr-search-criteria-view #criteriaView (search)="search()" (criteriaChanged)="listView.onFilterInputsChanged()">
  <app-search-stats-bar
    [rangeFrom]="criteriaView.criteria.fromYear" [rangeTo]="criteriaView.criteria.toYear"
    [availableInRange]="availableInRange()" [total]="grandTotal()" [loadedCount]="pullRequestsDataService.pullRequests().length"
    [(limit)]="limit" />
</app-github-pr-search-criteria-view>

<app-github-pr-list-view #listView
  [rowData]="pullRequestsDataService.pullRequests()"
  [criteria]="criteriaView.criteria"
  (rowSelected)="selectedPullRequest.set($event)" />

@if (selectedPullRequest(); as pr) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="openDetailAsRoute()">Show as page</button>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <app-github-pr-view [pullRequest]="pr" />
  </div>
}
