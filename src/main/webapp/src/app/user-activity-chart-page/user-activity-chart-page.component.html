<H4>User Activity</H4>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">From year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="fromYear" />
  </div>
  <div>
    <label class="form-label">To year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="toYear" />
  </div>
  <button class="btn btn-primary" type="button" (click)="search()">Search</button>
</div>

@for (panel of panels; track panel.title) {
  <section class="mb-5">
    <h5>{{ panel.title }}</h5>

    <div class="d-flex flex-wrap gap-4 mb-3 align-items-start">
      <div>
        <label class="form-label">Top N users</label>
        <input
          class="form-control app-number-input-sm"
          type="number"
          [(ngModel)]="panel.topN"
          (ngModelChange)="panel.onTopNChanged()" />
      </div>
      <fieldset class="d-flex flex-column">
        <legend class="h6 mb-1">
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="'expand-' + panel.title"
              [checked]="panel.expanded"
              (change)="panel.toggleExpanded()" />
            <label class="form-check-label" [for]="'expand-' + panel.title">Expand details</label>
          </div>
        </legend>
        @if (panel.expanded) {
          @for (field of panel.fields; track field.key) {
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'field-' + panel.title + '-' + field.key"
                [checked]="panel.isFieldEnabled(field.key)"
                (change)="panel.toggleField(field.key)" />
              <label class="form-check-label" [for]="'field-' + panel.title + '-' + field.key">{{ field.label }}</label>
            </div>
          }
        }
      </fieldset>
    </div>

    @for (fieldChart of panel.fieldCharts(); track fieldChart.key) {
      <highcharts-chart
        [options]="fieldChart.options"
        [oneToOne]="true"
        class="mb-3"
        style="width: 100%; height: 320px; display: block;">
      </highcharts-chart>
    }

    <ag-grid-angular
      class="mt-3"
      style="width: 100%; height: 400px;"
      [rowData]="panel.rowData()"
      [columnDefs]="panel.colDefs"
      (cellValueChanged)="panel.onChartToggleChanged($event)" />
  </section>
}
