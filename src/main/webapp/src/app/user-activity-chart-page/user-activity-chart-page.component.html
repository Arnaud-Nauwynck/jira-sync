<H4>User Activity</H4>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">From year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="fromYear" />
  </div>
  <div>
    <label class="form-label">To year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="toYear" />
  </div>
  <div>
    <label class="form-label">Top N users</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="topN" (ngModelChange)="onTopNChanged()" />
  </div>
  <button class="btn btn-primary" type="button" (click)="search()">Search</button>
</div>

<div class="d-flex flex-wrap gap-4 mb-3">
  @for (fieldGroup of fieldGroups; track fieldGroup.group) {
    <fieldset class="d-flex flex-column">
      <legend class="h6 mb-1">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="'visible-' + fieldGroup.group"
            [checked]="isGroupVisible(fieldGroup.group)"
            (change)="toggleGroupVisible(fieldGroup.group)" />
          <label class="form-check-label" [for]="'visible-' + fieldGroup.group">{{ fieldGroup.group }}</label>
        </div>
      </legend>
      @if (isGroupVisible(fieldGroup.group)) {
        <div class="form-check form-switch mb-1">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            [id]="'expand-' + fieldGroup.group"
            [checked]="isGroupExpanded(fieldGroup.group)"
            (change)="toggleGroupExpanded(fieldGroup.group)" />
          <label class="form-check-label small" [for]="'expand-' + fieldGroup.group">Expand details</label>
        </div>
        @if (isGroupExpanded(fieldGroup.group)) {
          @for (field of fieldGroup.fields; track field.key) {
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'field-' + field.key"
                [checked]="isFieldEnabled(field.key)"
                (change)="toggleField(field.key)" />
              <label class="form-check-label" [for]="'field-' + field.key">{{ field.label }}</label>
            </div>
          }
        }
      }
    </fieldset>
  }
</div>

@for (fieldChart of fieldCharts(); track fieldChart.key) {
  <highcharts-chart
    [options]="fieldChart.options"
    [oneToOne]="true"
    class="mb-3"
    style="width: 100%; height: 320px; display: block;">
  </highcharts-chart>
}

<ag-grid-angular
  class="mt-3"
  style="width: 100%; height: 400px;"
  [rowData]="rowData()"
  [columnDefs]="colDefs"
  (cellValueChanged)="onChartToggleChanged($event)" />
