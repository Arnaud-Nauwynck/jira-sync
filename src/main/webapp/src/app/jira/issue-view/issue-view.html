<style>
  .issue-view {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #172b4d;
  }
  .issue-header {
    border-bottom: 1px solid #dfe1e6;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .breadcrumbs {
    font-size: 12px;
    color: #6b778c;
    margin-bottom: 4px;
  }
  .breadcrumbs a {
    color: #0052cc;
    text-decoration: none;
  }
  .issue-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
</style>

@if (issue; as data) {
  <div class="issue-view">
    <header class="issue-header">
      <div class="breadcrumbs">
        @if (data.fields?.project) {
          <span>{{ data.fields?.project }}</span> / <span>{{ data.key }}</span>
        } @else {
          <span>{{ data.key }}</span>
        }
      </div>
      <h1 class="issue-title">{{ data.fields?.summary }}</h1>
    </header>

    <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
      <li [ngbNavItem]="1">
        <button ngbNavLink>Jira Source</button>
        <ng-template ngbNavContent>
          <app-jira-issue-view [issue]="data" />
        </ng-template>
      </li>
      <li [ngbNavItem]="2">
        <button ngbNavLink>Analysis</button>
        <ng-template ngbNavContent>
          <app-analysis-issue-view [annotated]="data.annotated" />
        </ng-template>
      </li>
      <li [ngbNavItem]="3">
        <button ngbNavLink>Development Work</button>
        <ng-template ngbNavContent>
          <app-work-development-issue-view [annotated]="data.annotated" />
        </ng-template>
      </li>
      <li [ngbNavItem]="4">
        <button ngbNavLink>Timeline</button>
        <ng-template ngbNavContent>
          <app-timeline-issue-view [issue]="data" />
        </ng-template>
      </li>
      <li [ngbNavItem]="5">
        <button ngbNavLink>Personal Interrest</button>
        <ng-template ngbNavContent>
          <app-personal-interest-issue-view [issue]="data" />
        </ng-template>
      </li>
    </ul>
    <div [ngbNavOutlet]="nav" class="mt-3"></div>
  </div>
}
