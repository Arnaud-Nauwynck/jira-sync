<div style="margin-bottom: 4px;">
  <button type="button" (click)="onAnalyzeAll()" [disabled]="selectedRows.length === 0 || analyzing()">Analyze All</button>
  <button type="button" style="margin-left: 4px;" (click)="onParallelAnalyzeAll()" [disabled]="selectedRows.length === 0 || analyzing()">Parallel Analyze All</button>
  <a href="/api/v1/jira-issue-annotations/download-all-analyses" download="jira-analyses.txt"><button type="button" style="margin-left: 4px;">Download All Analyzes</button></a>
  <span style="margin-left: 8px;">{{ selectedRows.length }} selected</span>
  @if (analyzeError()) { <span style="margin-left: 8px; color: red;">{{ analyzeError() }}</span> }
</div>
<div appResizableHeight style="height: 500px;">
  <ag-grid-angular
    style="width: 100%; height: 100%;"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [rowSelection]="rowSelection"
    (selectionChanged)="onSelectionChanged($event)"
    [isExternalFilterPresent]="isExternalFilterPresent"
    [doesExternalFilterPass]="doesExternalFilterPass"
    (gridReady)="onGridReady($event)" />
</div>
