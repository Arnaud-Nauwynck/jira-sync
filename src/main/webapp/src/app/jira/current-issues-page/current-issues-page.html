<div class="container-fluid">
  <h2>Current Issues</h2>

  <div class="d-flex gap-2 align-items-end flex-wrap mb-3">
    <app-date-range-filter fromLabel="Start date" toLabel="End date"
      [from]="startDate" (fromChange)="onStartDateChange($event)"
      [to]="endDate" (toChange)="onEndDateChange($event)" />
    <div>
      <label class="form-label">Bucket by</label>
      <select class="form-select" [(ngModel)]="bucketBy">
        @for (b of bucketByOptions; track b.value) {
          <option [value]="b.value">{{ b.label }}</option>
        }
      </select>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="countOpenedBefore" [(ngModel)]="countOpenedBefore" />
      <label class="form-check-label" for="countOpenedBefore">Count opened before</label>
    </div>
    <app-exclude-dropdown-filter label="Component" [options]="componentFilterOptions()"
      [excluded]="excludedComponents" (excludedChange)="onExcludedComponentsChange($event)" />
    <app-exclude-dropdown-filter label="Issue Type" [options]="issueTypeFilterOptions"
      [excluded]="excludedIssueTypes" (excludedChange)="onExcludedIssueTypesChange($event)" />
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="creationOnly" [(ngModel)]="creationOnly" />
      <label class="form-check-label" for="creationOnly">Creation only</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="showDetails" [(ngModel)]="showDetails" />
      <label class="form-check-label" for="showDetails">Show details</label>
    </div>
    <button class="btn btn-primary" type="button" [disabled]="loading()" (click)="search()">
      {{ loading() ? 'Loading...' : 'Search' }}
    </button>
    @if (errorMessage()) {
      <span class="text-danger">{{ errorMessage() }}</span>
    }
  </div>

  @for (section of sections(); track section.component) {
    <section class="mb-4">
      <h5>{{ section.component }} <small class="text-muted">({{ section.issueCount }} issues)</small></h5>
      <highcharts-chart [options]="section.chartOptions" [oneToOne]="true" style="display: block; width: 100%; height: 300px;" />
      @if (showDetails) {
        <ag-grid-angular style="width: 100%; height: 250px;"
          [rowData]="section.issueTypeCounts" [columnDefs]="issueTypeCountColDefs" />
      }
    </section>
  }
</div>
