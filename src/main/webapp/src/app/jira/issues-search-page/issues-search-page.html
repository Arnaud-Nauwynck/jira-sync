<H4>Issues</H4>

<app-issues-list-criteria-view [criteria]="criteria" [loading]="loading" [loadErrorMessage]="loadErrorMessage" (search)="search()" (criteriaChanged)="listView.onFilterInputsChanged()">
  <app-search-stats-bar
    [rangeFrom]="criteria.fromYear" [rangeTo]="criteria.toYear"
    [availableInRange]="availableInRange()" [total]="grandTotal()" [loadedCount]="issuesDataService.issues().length"
    [(limit)]="limit" />
</app-issues-list-criteria-view>

<app-issues-list-view #listView
  [rowData]="issuesDataService.issues()"
  [criteria]="criteria"
  (rowSelected)="selectedIssue.set($event)" />

@if (selectedIssue(); as data) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="openDetailAsRoute()">Show as page</button>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <app-issue-view [issue]="data" />
  </div>
}
