<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Recent Activity</h4>
  <div class="d-flex align-items-center gap-2">
    <span class="badge" [class.text-bg-success]="!eventLogService.suspended()" [class.text-bg-secondary]="eventLogService.suspended()">
      {{ eventLogService.suspended() ? 'Suspended' : 'Live' }}
    </span>
    <button class="btn btn-sm btn-outline-primary" type="button" (click)="toggleSuspend()">
      {{ eventLogService.suspended() ? 'Resume' : 'Suspend' }}
    </button>
    <button class="btn btn-sm btn-outline-secondary" type="button" (click)="eventLogService.clear()">Clear</button>
  </div>
</div>

<div class="row g-2 mb-3">
  <div class="col-auto">
    <select class="form-select form-select-sm" [(ngModel)]="filterEventType" (ngModelChange)="onFilterChanged()">
      <option value="">All types</option>
      @for (opt of eventTypeOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>
  <div class="col-auto">
    <select class="form-select form-select-sm" [(ngModel)]="filterChangeType" (ngModelChange)="onFilterChanged()">
      <option value="">All changes</option>
      @for (opt of changeTypeOptions; track opt) {
        <option [value]="opt">{{ opt }}</option>
      }
    </select>
  </div>
  <div class="col-auto">
    <input class="form-control form-control-sm" type="text" placeholder="Search entity / details"
      [(ngModel)]="filterText" (ngModelChange)="onFilterChanged()" />
  </div>
  <div class="col-auto ms-auto align-self-center text-muted small">
    {{ eventLogService.events().length }} event(s)
  </div>
</div>

<ag-grid-angular
  style="width: 100%; height: 600px;"
  [rowData]="eventLogService.events()"
  [columnDefs]="colDefs"
  [isExternalFilterPresent]="isExternalFilterPresent"
  [doesExternalFilterPass]="doesExternalFilterPass"
  (gridReady)="onGridReady($event)" />
