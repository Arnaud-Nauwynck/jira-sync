<div class="form-check mb-2">
  <input class="form-check-input" type="checkbox" id="showAdvanced"
         [checked]="showAdvanced()" (change)="showAdvanced.set(!showAdvanced())">
  <label class="form-check-label" for="showAdvanced">Show advanced</label>
</div>

<H1>Jira Synchronisation</H1>

<div class="text-secondary small mb-2">
  Last sync: {{ lastSyncTime() ?? 'never' }}
</div>
<button class="btn btn-primary" type="button" [disabled]="running()" (click)="runSyncAll()">
  Run Sync All
</button>

<H1>GitHub Pull-Requests Sync</H1>

<div class="text-secondary small mb-2">
  Last sync: {{ githubLastSyncTime() ?? 'never' }}
</div>
<button class="btn btn-primary" type="button" [disabled]="githubRunning()" (click)="runGitHubSyncAll()">
  Run Sync All
</button>
@if (showAdvanced()) {
  <button class="btn btn-secondary" type="button" [disabled]="githubCompletingReviewComments()" (click)="completeMissingReviewComments()">
    Complete Missing Review Comments
  </button>
  <button class="btn btn-secondary" type="button" [disabled]="githubCompletingComments()" (click)="completeMissingComments()">
    Complete Missing Comments
  </button>
}

<H1>Mailing List Sync</H1>

<div class="text-secondary small mb-2">
  Last fully-archived month: {{ mailingListLastClosedMonth() ?? 'never' }}
</div>
<button class="btn btn-primary" type="button" [disabled]="mailingListRunning()" (click)="runMailingListSyncAll()">
  Run Sync All
</button>
