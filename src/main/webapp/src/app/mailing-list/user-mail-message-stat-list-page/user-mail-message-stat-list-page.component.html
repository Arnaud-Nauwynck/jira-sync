<H4>User - MailingList Statistics</H4>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">From year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="fromYear" />
  </div>
  <div>
    <label class="form-label">To year</label>
    <input class="form-control app-number-input-sm" type="number" [(ngModel)]="toYear" />
  </div>
  <div>
    <label class="form-label">From pattern</label>
    <input class="form-control" type="text" [(ngModel)]="fromPattern" placeholder="regex on From header, optional" />
  </div>
  <button class="btn btn-primary" type="button" (click)="search()">Search</button>
</div>

<div class="d-flex gap-2 align-items-end mb-3">
  <div>
    <label class="form-label">Min messages</label>
    <input class="form-control" type="number" [(ngModel)]="minMessages" (ngModelChange)="onFilterInputsChanged()" />
  </div>
  <div>
    <label class="form-label">Max messages</label>
    <input class="form-control" type="number" [(ngModel)]="maxMessages" (ngModelChange)="onFilterInputsChanged()" />
  </div>
  <div>
    <label class="form-label">Name contains</label>
    <input class="form-control" type="text" [(ngModel)]="nameContains" (ngModelChange)="onFilterInputsChanged()" placeholder="comma separated, e.g. john,mary" />
  </div>
  <div>
    <label class="form-label">Name pattern</label>
    <input class="form-control" type="text" [(ngModel)]="namePattern" (ngModelChange)="onFilterInputsChanged()" placeholder="comma separated regex, e.g. ^jo.*,mary$" />
  </div>
</div>

<ag-grid-angular
  style="width: 100%; height: 500px;"
  [rowData]="rowData()"
  [columnDefs]="colDefs()"
  [isExternalFilterPresent]="isExternalFilterPresent"
  [doesExternalFilterPass]="doesExternalFilterPass"
  (gridReady)="onGridReady($event)" />

@if (selectedMessage(); as msg) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <div><strong>Subject:</strong> {{ msg.subject }}</div>
    <div><strong>From:</strong> {{ msg.from }}</div>
    <div><strong>To:</strong> {{ (msg.to ?? []).join(', ') }}</div>
    @if (msg.cc && msg.cc.length > 0) {
      <div><strong>Cc:</strong> {{ msg.cc.join(', ') }}</div>
    }
    <div><strong>Date:</strong> {{ msg.date }}</div>
    <hr />
    <pre style="white-space: pre-wrap;">{{ msg.bodyText }}</pre>
  </div>
}
