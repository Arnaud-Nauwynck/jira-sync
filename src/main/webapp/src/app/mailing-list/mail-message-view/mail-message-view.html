<style>
  .mail-view {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #172b4d;
  }
  .mail-header {
    border-bottom: 1px solid #dfe1e6;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .mail-breadcrumbs {
    font-size: 12px;
    color: #6b778c;
    margin-bottom: 4px;
  }
  .mail-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
</style>

@if (message; as msg) {
  <div class="mail-view">
    <header class="mail-header">
      <div class="mail-breadcrumbs">
        <span>{{ msg.from }}</span> — <span>{{ msg.date }}</span>
      </div>
      <h1 class="mail-title">{{ msg.subject }}</h1>
    </header>

    <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
      <li [ngbNavItem]="1">
        <button ngbNavLink>Mail Source</button>
        <ng-template ngbNavContent>
          <app-mail-source-view [message]="msg" />
        </ng-template>
      </li>
      <li [ngbNavItem]="2">
        <button ngbNavLink>Analysis</button>
        <ng-template ngbNavContent>
          <app-analysis-mail-view [annotated]="msg.annotated" />
        </ng-template>
      </li>
      <li [ngbNavItem]="3">
        <button ngbNavLink>Development Work</button>
        <ng-template ngbNavContent>
          <app-work-development-mail-view [annotated]="msg.annotated" />
        </ng-template>
      </li>
      <li [ngbNavItem]="4">
        <button ngbNavLink>Timeline</button>
        <ng-template ngbNavContent>
          <app-timeline-mail-view [message]="msg" />
        </ng-template>
      </li>
      <li [ngbNavItem]="5">
        <button ngbNavLink>Personal Interrest</button>
        <ng-template ngbNavContent>
          <app-personal-interest-mail-view [message]="msg" />
        </ng-template>
      </li>
    </ul>
    <div [ngbNavOutlet]="nav" class="mt-3"></div>
  </div>
}
