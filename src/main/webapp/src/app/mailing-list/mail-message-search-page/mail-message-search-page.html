<H4>Mailing List Messages</H4>

<app-mail-message-criteria-view #criteriaView (search)="search()" (criteriaChanged)="listView.onFilterInputsChanged()" />

<app-search-stats-bar
  [rangeFrom]="criteriaView.criteria.fromMonth || '…'" [rangeTo]="criteriaView.criteria.toMonth || '…'"
  [availableInRange]="availableInRange()" [total]="grandTotal()" [matchingCount]="messagesDataService.messages().length"
  [(limit)]="limit" [(cachedLimit)]="cachedLimit" />

<app-mail-message-list-view #listView
  [rowData]="messagesDataService.messages()"
  [criteria]="criteriaView.criteria"
  (rowSelected)="selectedMessage.set($event)" />

@if (selectedMessage(); as msg) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="openDetailAsRoute()">Show as page</button>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <app-mail-message-view [message]="msg" />
  </div>
}
