<H4>Mailing List Messages</H4>

<app-mail-message-criteria-view [criteria]="criteria" [loading]="loading" [loadErrorMessage]="loadErrorMessage" [(limit)]="limit" (search)="search()" (criteriaChanged)="onCriteriaChanged()" (searchModeChange)="onSearchModeChange($event)">
  <app-search-stats-bar
    [rangeFrom]="criteria.fromMonth || '…'" [rangeTo]="criteria.toMonth || '…'"
    [availableInRange]="availableInRange()" [total]="grandTotal()" [loadedCount]="messagesDataService.messages().length"
    [(limit)]="limit" />
</app-mail-message-criteria-view>

@if (!hideList()) {
  <app-mail-message-list-view
    [rowData]="messagesDataService.messages()"
    [criteria]="criteria"
    (rowSelected)="selectedMessage.set($event)" />
}

@if (selectedMessage(); as msg) {
  <div class="border rounded mt-3 p-3">
    <div class="d-flex justify-content-end gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="openDetailAsRoute()">Show as page</button>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeDetail()">Close</button>
    </div>
    <app-mail-message-view [message]="msg" />
  </div>
}
